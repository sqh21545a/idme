<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IDme Web UI</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">Playwright + CloakBrowser</p>
        <h1>IDme 批量登录</h1>
        <p class="muted">选择 Excel 文件，启动批量登录，并查看运行日志。</p>
      </div>
      <div class="status-card">
        <span id="statusDot" class="dot"></span>
        <div>
          <strong id="statusText">读取状态中...</strong>
          <small id="pidText">PID: -</small>
        </div>
      </div>
    </header>

    <section class="grid">
      <form id="batchForm" class="card form-card batch-card">
        <h2>Excel 批量登录</h2>
        <p class="muted">Excel 第 A 列填写邮箱，第 B 列填写密码，第 C 列填写每个账号自己的 HTTP Proxy；运行后第 D 列写入登录状态，第 E 列写入记录时间，第 F 列记录当前 UA，第 G 列记录 MFA 标签。</p>

        <label>
          选择 Excel 文件
          <input id="excelFile" name="excelFile" type="file" accept=".xlsx,.xls">
        </label>
        <label>
          当前 Excel 文件路径
          <input id="excelPath" name="excel" value="idme-accounts.xlsx" autocomplete="off" readonly>
        </label>
        <label>
          URL
          <input name="url" value="https://api.id.me/en/session/new" autocomplete="off">
        </label>
        <label>
          默认 HTTP Proxy（Excel C 列为空时才使用）
          <input name="proxy" value="http://wXYSygNq:rIj4WNT75PF12hPb@us.proxy302.com:2222" autocomplete="off">
        </label>
        <div class="two">
          <label>
            Profile Base
            <input name="profileBase" value=".idme-batch-profile" autocomplete="off">
          </label>
          <label>
            单账号无输出超时 ms
            <input name="timeoutMs" value="120000" type="number" min="10000" step="10000">
          </label>
        </div>
        <div class="two">
          <label>
            同时运行浏览器数
            <input name="concurrency" value="1" type="number" min="1" max="10" step="1">
          </label>
          <label>
            开始行，可空
            <input name="startRow" value="" type="number" min="1" step="1" placeholder="默认自动识别">
          </label>
        </div>
        <div class="two">
          <label>
            结束行，可空
            <input name="endRow" value="" type="number" min="1" step="1" placeholder="默认到最后一行">
          </label>
          <label>
            browser_blocked 次数上限
            <input name="browserBlockedLimit" value="3" type="number" min="1" max="10" step="1">
          </label>
        </div>
        <div class="checks">
          <label class="checkline"><input name="browserMode" type="radio" value="headless"> 无头运行</label>
          <label class="checkline"><input name="browserMode" type="radio" value="headed" checked> 有头运行</label>
          <label class="checkline"><input name="profileMode" type="radio" value="fresh"> 每次新环境</label>
          <label class="checkline"><input name="profileMode" type="radio" value="reuse" checked> 复用环境</label>
          <label class="checkline"><input name="userAgentMode" type="radio" value="random"> 每次新 UA</label>
          <label class="checkline"><input name="userAgentMode" type="radio" value="fixed" checked> 固定 UA</label>
          <label class="checkline"><input name="browserBlockedRetry" type="checkbox" checked> browser_blocked 后换新 UA 重试一次</label>
          <label class="checkline"><input name="noProxy" type="checkbox"> 禁用代理</label>
        </div>
        <div class="actions">
          <button type="submit" class="primary">批量登录</button>
          <button type="button" id="stopBtn" class="danger">停止</button>
          <button type="button" id="refreshBtn">刷新日志</button>
        </div>
      </form>
    </section>

    <section class="card logs-card">
      <div class="card-title-row">
        <h2>运行日志</h2>
        <button type="button" id="clearLogsBtn">清空显示</button>
      </div>
      <pre id="logs"></pre>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
